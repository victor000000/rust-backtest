[workspace]
resolver = "2"
members = [
    "crates/lbr",
    "crates/lbr-cli",
]
# Private strategy crates live under `private/` and are NOT part of the
# public workspace. They are git-ignored and intended to be developed
# locally or in a private repo.
exclude = ["private"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/victor000000/rust-backtest"
authors = ["victor000000"]

[workspace.dependencies]
# Internal crates
lbr = { path = "crates/lbr" }

# External
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
yahoo_finance_api = "2"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["serde", "parsing", "macros"] }
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# To enable native CPU SIMD (AVX2/AVX-512 if your CPU supports it), build with:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
# We keep the default portable here so artifacts remain transferable.
